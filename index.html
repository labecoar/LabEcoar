<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon_top.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuíca Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('labecoar-theme');
          var userChose = localStorage.getItem('labecoar-theme-user-choice') === '1';
          var mode;
          if (userChose && (stored === 'light' || stored === 'dark')) {
            mode = stored;
          } else {
            mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
